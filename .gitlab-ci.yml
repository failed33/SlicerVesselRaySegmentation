image: python:3.12-slim-trixie

default:
  tags: [linux]
  interruptible: true
  timeout: 20 minutes

include:
  - local: .gitlab/acceptance.yml

stages:
  - test
  - publish

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  GIT_LFS_SKIP_SMUDGE: "1"
  GITHUB_REPOSITORY: failed33/SlicerVesselRaySegmentation
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest
  TRANSFER_METER_FREQUENCY: 10s
  ORT_DISABLE_TELEMETRY: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

.python-job:
  after_script:
    - uv cache prune --ci
  before_script:
    - python -m pip install uv==0.12.23
  cache:
    key:
      files: [deployment/inference/uv.lock, deployment/monai/uv.lock]
      prefix: python312-$CI_JOB_NAME-$CI_RUNNER_ID-$CI_PIPELINE_SOURCE-$CI_COMMIT_REF_PROTECTED
    paths: [.uv-cache/]

lint:python:
  extends: .python-job
  timeout: 5 minutes
  script:
    - uv sync --frozen
    - uv run --frozen ruff check .
    - uv run --frozen ruff format --check .

test:inference:
  extends: .python-job
  tags: [linux, large]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git cmake make g++ ninja-build libgomp1
    - python -m pip install uv==0.12.23
  script:
    - uv sync --frozen
    - UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/deployment/inference/.venv-typecheck" uv sync --project deployment/inference --python 3.12 --frozen --all-extras --group native --group test
    - .venv/bin/pyrefly check --config deployment/inference/pyproject.toml
    - deployment/inference/.venv-typecheck/bin/python -m pytest -q deployment/inference/tests --junitxml=build/inference-tests.xml
  artifacts:
    when: always
    reports:
      junit: build/inference-tests.xml

test:service-and-application:
  extends: .python-job
  tags: [linux, large]
  variables:
    VRS_TEST_ENDPOINT_PYTHON: $CI_PROJECT_DIR/deployment/monai/.venv-typecheck/bin/python
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends g++ make libgomp1
    - python -m pip install uv==0.12.23
  script:
    - uv sync --frozen
    - UV_PROJECT_ENVIRONMENT="$CI_PROJECT_DIR/deployment/monai/.venv-typecheck" uv sync --project deployment/monai --python 3.12 --frozen --all-extras --group dev
    - .venv/bin/pyrefly check --config pyproject.toml
    - .venv/bin/pyrefly check --config deployment/monai/pyproject.toml
    - cd deployment/monai && .venv-typecheck/bin/python -m pytest -q tests --junitxml=../../build/monai-tests.xml
    - cd ../.. && deployment/monai/.venv-typecheck/bin/python -m pytest -q VesselRaySegmentation/Testing/Python --junitxml=build/workflow-tests.xml
  artifacts:
    when: always
    reports:
      junit: [build/monai-tests.xml, build/workflow-tests.xml]

test:publication:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git cmake make shellcheck
  script:
    - shellcheck -x tools/ci/*.sh
    - python -m unittest discover -s tests/infrastructure -v

publish:github:
  stage: publish
  needs:
    - {job: test:publication, artifacts: false}
    - {job: lint:python, artifacts: false}
    - {job: test:inference, artifacts: false}
    - {job: test:service-and-application, artifacts: false}
    - {job: acceptance:shaders, artifacts: false}
    - {job: acceptance:shared-python, artifacts: false}
    - {job: acceptance:packages, artifacts: false}
    - {job: acceptance:native, artifacts: false}
    - {job: acceptance:wasm, artifacts: false}
    - {job: acceptance:desktop, artifacts: false}
    - {job: acceptance:web, artifacts: false}
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git openssh-client
  resource_group: github-publication
  interruptible: false
  environment:
    name: public
    url: https://github.com/failed33/SlicerVesselRaySegmentation
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - python tools/publication/publish.py
