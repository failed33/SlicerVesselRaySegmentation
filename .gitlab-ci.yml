image: python:3.12-alpine

default:
  tags: [k8s-small-arm64]

stages:
  - test
  - publish

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  GITHUB_REPOSITORY: failed33/SlicerVesselRaySegmentation

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

before_script:
  - apk add --no-cache git openssh-client cmake make

test:publication:
  stage: test
  script:
    - python -m unittest discover -s tests -v

publish:github:
  stage: publish
  needs: ["test:publication"]
  resource_group: github-publication
  interruptible: false
  environment:
    name: public
    url: https://github.com/failed33/SlicerVesselRaySegmentation
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - python ci/publish.py
