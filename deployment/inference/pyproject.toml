[project]
name = "vessel-inference"
version = "0.1.0"
description = "Reusable ARG and ModelO inference with native Dawn buffer sharing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
# Shared array preparation also runs in SlicerWeb; native/server extras are separate.
numerical = ["numpy>=1.26,<3", "scipy>=1.13,<2"]
dawn = ["numpy>=1.26,<3", "onnxruntime==1.30.0"]
arg-support = ["vessel-inference[numerical]", "scikit-image>=0.26,<1", "SimpleITK>=2.5,<3"]
arg = ["vessel-inference[arg-support]", "onnxruntime==1.30.0"]
model-o-support = ["vessel-inference[numerical,schemas]", "SimpleITK>=2.5,<3", "onnx>=1.23,<2"]
model-o = ["vessel-inference[dawn,model-o-support]"]
registry = ["mlflow-skinny>=3.16,<4", "filelock>=4,<5"]
schemas = ["pydantic>=2.13,<3"]
label = ["monailabel==0.8.5", "fastapi==0.142.2", "pydantic>=2.13,<3", "pydicom>=2.4,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dawn_ort", "src/cuda_ort", "src/arg_inference", "src/model_o_inference", "src/model_artifacts", "src/label_inference"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE.txt", "/pyproject.toml"]

[dependency-groups]
native = [
  "jinja2==3.1.6",
  "clang==18.1.8",
  "ctypeslib2==2.4.0",
  "libclang==18.1.1",
]
test = ["numpy>=1.26,<3", "scipy>=1.13,<2", "onnxruntime==1.30.0", "onnx>=1.23,<2", "pytest>=8"]
example = ["numpy>=1.26,<3", "onnxruntime==1.30.0", "scipy>=1.13,<2", "onnx>=1.23,<2"]

# The lockfile serves the native/Label development environment. Shared numerical
# wheels are also accepted independently on Python 3.14 without these profiles.
[tool.uv]
required-version = ">=0.10.7"
environments = ["python_version == '3.12' and sys_platform != 'emscripten'"]

[tool.pyrefly]
python-version = "3.12"
python-interpreter-path = ".venv-typecheck/bin/python"
search-path = ["src"]
project-includes = ["src/**/*.py", "tests/**/*.py"]
