name: Backend CI
'on':
  push:
    tags:
      - v*
  pull_request:
    paths:
      - VesselRaySegmentation/**
      - deployment/**
      - tools/**
      - tests/integration/**
      - slicerweb-extension.json
      - CMakeLists.txt
      - .github/workflows/backend-ci.yml
  workflow_dispatch: null
  schedule:
    - cron: 57 4 * * 0
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  ORT_DISABLE_TELEMETRY: '1'
  MLFLOW_DISABLE_TELEMETRY: 'true'
  MLFLOW_DISABLE_AGENT_HINT: '1'
jobs:
  shaders:
    name: Slang shader regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/slang
          key: slang-linux-amd64-${{ hashFiles('tools/packaging/compile_shaders.py') }}
      - name: Run shared acceptance commands
        run: python tools/packaging/compile_shaders.py --check
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
  shared-python:
    name: Shared Python / ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            numpy: 1.26.4
            scipy: 1.13.1
          - python: '3.14'
            numpy: 2.5.4
            scipy: 1.18.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/cache/uv
          key: acceptance-shared-python-ubuntu2404-${{ matrix.python }}-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake',
            'deployment/inference/wasm/toolchain.json') }}-${{ github.sha }}
          restore-keys: acceptance-shared-python-ubuntu2404-${{ matrix.python }}-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake',
            'deployment/inference/wasm/toolchain.json') }}-
      - name: Run shared acceptance commands
        run: bash tools/ci/shared-python.sh
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
      - name: Keep numerical acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: shared-python-${{ matrix.python }}
          retention-days: 7
          path: build/shared-python/report.json
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
      PYTHON_VERSION: ${{ matrix.python }}
      NUMPY_VERSION: ${{ matrix.numpy }}
      SCIPY_VERSION: ${{ matrix.scipy }}
  packages:
    name: Python wheels and MONAI containers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/backend/installed
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/cache/uv
          key: acceptance-packages-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-${{ github.sha }}
          restore-keys: acceptance-packages-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-
      - name: Install pinned build tools
        run: python -m pip install uv==0.12.23
      - name: Run shared acceptance commands
        run: bash tools/ci/packages.sh
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
      - name: Keep distributions and acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: backend-packages
          retention-days: 7
          path: |
            build/backend/dist/
            build/backend/*.json
            build/backend/*.xml
            build/backend/*.log
            build/backend/containers/
  native:
    name: Native Dawn and ORT / Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |-
            build/cache/uv
            build/cache/ccache
          key: acceptance-native-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-${{ github.sha }}
          restore-keys: acceptance-native-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-
      - name: Install native build and software Vulkan dependencies
        run: |
          python -m pip install uv==0.12.23
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libvulkan1 mesa-vulkan-drivers libegl1 libxext6
          uv sync --project deployment/inference --frozen --group native --group test
      - name: Run shared acceptance commands
        run: bash tools/ci/native.sh
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
      - name: Hand the desktop runtime to application tests
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: desktop-runtime
          retention-days: 1
          path: |
            build/desktop-runtime.tar.gz
            build/backend/dist/vessel_inference-*.whl
      - name: Keep the native bundle and test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-linux-x86-64
          retention-days: 7
          path: |
            build/backend/native/*.zip
            build/backend/native/*.json
            build/backend/inference-tests.xml
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
  wasm:
    name: Patched ORT WebGPU / WASM source build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |-
            build/cache/uv
            build/cache/ccache
            build/cache/emscripten
            build/cache/npm
          key: acceptance-wasm-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-${{ github.sha }}
          restore-keys: acceptance-wasm-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-
      - name: Install build tools
        run: |
          python -m pip install uv==0.12.23
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build
      - name: Run shared acceptance commands
        run: bash tools/ci/wasm.sh
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
      - name: Keep the compiled component and its provenance
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wasm-runtime
          retention-days: 7
          path: |
            build/wasm/dist/
            build/wasm/build.log
            build/backend/dist/vessel_inference-*.whl
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
  desktop-runtime:
    name: Packaged native inference / Slicer ${{ matrix.channel }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel:
          - stable
          - nightly
    env:
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      ORT_WEBGPU_EP_ALLOW_SOFTWARE_ADAPTER: '1'
      VRS_RUNTIME_ALLOW_SOFTWARE: '1'
      VRS_RUNTIME_FIXTURES: ${{ github.workspace }}/build/runtime-fixtures
      PACKAGE_ROOT: ${{ github.workspace }}/build/desktop-package/unpacked
      TEST_REPORT: ${{ github.workspace }}/build/desktop-package/desktop.json
      VRS_TEST_ENDPOINT_PYTHON: ${{ github.workspace }}/build/workflow-endpoint/bin/python
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: desktop-runtime
          path: build
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/cache/uv
          key: acceptance-desktop-runtime-ubuntu2404-${{ matrix.channel }}-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake',
            'deployment/inference/wasm/toolchain.json') }}-${{ github.sha }}
          restore-keys: acceptance-desktop-runtime-ubuntu2404-${{ matrix.channel }}-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake',
            'deployment/inference/wasm/toolchain.json') }}-
      - name: Install application and software GPU prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libglu1-mesa libopengl0 libpulse-mainloop-glib0 \
            libnss3 libasound2t64 qt5dxcb-plugin libsm6 libxcb-cursor0 \
            libvulkan1 mesa-vulkan-drivers libegl1 libxext6
          python -m pip install uv==0.12.23
      - name: Run shared acceptance commands
        run: bash tools/ci/desktop.sh "${{ matrix.channel }}" runtime
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
      - name: Keep application acceptance reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-inference-slicer-${{ matrix.channel }}
          retention-days: 7
          path: |
            build/desktop-package/*.json
            build/desktop-package/*.log
            build/slicer/download.json
  web-runtime:
    name: Packaged WASM inference / SlicerWeb
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SLICERWEB_WHEELS: ${{ github.workspace }}/build/web-runtime/wheels
      SLICERWEB_EXTENSIONS: ${{ github.workspace }}/build/web-package/wheels
      UV_CACHE_DIR: ${{ github.workspace }}/build/cache/uv
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: wasm-runtime
          path: build
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |-
            build/cache/uv
            build/cache/npm
          key: acceptance-web-runtime-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-${{ github.sha }}
          restore-keys: acceptance-web-runtime-ubuntu2404-${{ hashFiles('deployment/inference/uv.lock', 'deployment/monai/uv.lock', 'deployment/inference/native/pins.cmake', 'deployment/inference/wasm/toolchain.json')
            }}-
      - name: Run shared acceptance commands
        run: bash tools/ci/web.sh runtime
      - name: Prune downloaded wheels before saving cache
        if: always()
        run: uv cache prune --ci
      - name: Keep browser acceptance reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wasm-inference-slicerweb
          retention-days: 7
          path: |
            build/web-package/results/
            build/web-runtime/wheels/build-info.json
