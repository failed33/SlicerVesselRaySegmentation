name: Backend CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["deployment/**", "tools/**", "tests/integration/**", "slicerweb-extension.json", "CMakeLists.txt", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["deployment/**", "tools/**", "tests/integration/**", "slicerweb-extension.json", "CMakeLists.txt", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_DISABLE_TELEMETRY: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  shaders:
    name: Slang shader regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python tools/packaging/compile_shaders.py --check

  shared-python:
    name: Shared Python / ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.12", numpy: "1.26.4", scipy: "1.13.1"}
          - {python: "3.14", numpy: "2.5.4", scipy: "1.18.1"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Accept shared numerical code without native or server dependencies
        run: |
          python -m pip install uv==0.12.23
          uv build deployment/inference --out-dir build/shared-python/dist
          uv venv --python python build/shared-python/env
          uv pip install --python build/shared-python/env/bin/python \
            'build/shared-python/dist/vessel_inference-0.1.0-py3-none-any.whl[numerical]' \
            'numpy==${{ matrix.numpy }}' 'scipy==${{ matrix.scipy }}'
          build/shared-python/env/bin/python -I tests/integration/backend/shared_python.py --output build/shared-python/report.json
      - name: Keep numerical acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shared-python-${{ matrix.python }}
          retention-days: 7
          path: build/shared-python/report.json

  packages:
    name: Python wheels and MONAI containers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/backend/installed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install uv==0.12.23
      - name: Build wheels from source distributions
        run: |
          uv build deployment/inference --out-dir build/backend/dist
          uv build deployment/monai --out-dir build/backend/dist
      - name: Install locked dependencies and replace source packages with built wheels
        run: |
          uv sync --project deployment/monai --frozen --no-install-project --no-editable --group dev --extra arg --extra model-o --extra kubernetes
          uv pip install --python build/backend/installed/bin/python --no-deps --reinstall build/backend/dist/*.whl
      - name: Check backend formatting and imports
        run: |
          build/backend/installed/bin/ruff check tools tests/integration deployment/inference deployment/monai
          build/backend/installed/bin/ruff format --check tools tests/integration deployment/inference deployment/monai
      - name: Test packaged runtime asset integrity
        run: python -m unittest discover -s tests/integration/runtime -v
      - name: Test standalone backend behavior
        working-directory: deployment/monai
        run: ../../build/backend/installed/bin/python -m pytest -q tests --junitxml=../../build/backend/monai-tests.xml
      - name: Accept installed wheels outside the checkout
        run: build/backend/installed/bin/python -I tests/integration/backend/wheels.py --output build/backend/wheels.json
      - name: Build CPU ARG and MONAI Label containers
        run: |
          docker build -f deployment/monai/Dockerfile.workers --target arg -t vessel-arg:ci .
          docker build -f deployment/monai/Dockerfile.workers --target label_arg \
            --build-arg MONAI_UID="$(id -u)" --build-arg MONAI_GID="$(id -g)" -t vessel-label:ci .
      - name: Accept built containers with the synthetic ONNX model
        run: |
          build/backend/installed/bin/python -I tests/integration/backend/wheels.py --server-image vessel-label:ci --worker-image vessel-arg:ci --output build/backend/containers/report.json
          docker image inspect vessel-arg:ci vessel-label:ci > build/backend/containers/images.json
      - name: Keep distributions and acceptance evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-packages
          retention-days: 7
          path: |
            build/backend/dist/
            build/backend/*.json
            build/backend/*.xml
            build/backend/*.log
            build/backend/containers/

  native:
    name: Native Dawn and ORT / Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install native build and software Vulkan dependencies
        run: |
          python -m pip install uv==0.12.23
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan1 mesa-vulkan-drivers libegl1 libxext6
          uv sync --project deployment/inference --frozen --group native --group test
      - name: Test runtime boundaries and native build graph
        run: deployment/inference/.venv/bin/python -m pytest -q deployment/inference/tests --junitxml=build/backend/inference-tests.xml
      - name: Compile the pinned host bridge and patched provider
        run: |
          cmake -S deployment/inference/native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$PWD/deployment/inference/.venv/bin/python" -DCMAKE_INSTALL_PREFIX="$PWD/build/native/assets"
          cmake --build build/native --parallel 2
          cmake --install build/native
      - name: Bundle and test relocated native libraries
        env:
          # ORT intentionally requires an explicit opt-in on a host without a GPU.
          ORT_WEBGPU_EP_ALLOW_SOFTWARE_ADAPTER: "1"
        run: |
          python tools/packaging/bundle_native.py --build build/native --output build/backend/native
          deployment/inference/.venv/bin/python tests/integration/backend/native_bundle.py build/backend/native/*.zip --output build/backend/native/report.json
      - name: Bundle the isolated desktop Python runtime
        run: |
          uv build deployment/inference --out-dir build/backend/dist
          python tools/packaging/bundle_desktop.py --native-archive build/backend/native/dawn-ort-linux-x86_64.zip \
            --wheel build/backend/dist/vessel_inference-0.1.0-py3-none-any.whl --output build/desktop-runtime
          tar -czf build/desktop-runtime.tar.gz -C build/desktop-runtime/desktop-linux-x86_64 .
      - name: Hand the desktop runtime to application tests
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-runtime
          retention-days: 1
          path: |
            build/desktop-runtime.tar.gz
            build/backend/dist/vessel_inference-*.whl
      - name: Keep the native bundle and test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-linux-x86-64
          retention-days: 7
          path: |
            build/backend/native/*.zip
            build/backend/native/*.json
            build/backend/inference-tests.xml

  wasm:
    name: Patched ORT WebGPU / WASM source build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install build tools
        run: |
          python -m pip install uv==0.12.23
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Compile patched ORT and its matching WebGPU JavaScript bindings
        run: python tools/packaging/build_wasm.py --output build/wasm --jobs 2
      - name: Build the shared Python wheel
        run: uv build deployment/inference --out-dir build/backend/dist
      - name: Keep the compiled component and its provenance
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wasm-runtime
          retention-days: 7
          path: |
            build/wasm/dist/
            build/wasm/build.log
            build/backend/dist/vessel_inference-*.whl

  desktop-runtime:
    name: Packaged native inference / Slicer ${{ matrix.channel }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    env:
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      ORT_WEBGPU_EP_ALLOW_SOFTWARE_ADAPTER: "1"
      VRS_RUNTIME_ALLOW_SOFTWARE: "1"
      VRS_RUNTIME_FIXTURES: ${{ github.workspace }}/build/runtime-fixtures
      PACKAGE_ROOT: ${{ github.workspace }}/build/desktop-package/unpacked
      TEST_REPORT: ${{ github.workspace }}/build/desktop-package/desktop.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: desktop-runtime
          path: build/runtime-download
      - name: Install application and software GPU prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libglu1-mesa libopengl0 libpulse-mainloop-glib0 \
            libnss3 libasound2t64 qt5dxcb-plugin libsm6 libxcb-cursor0 \
            libvulkan1 mesa-vulkan-drivers libegl1 libxext6
          python -m pip install uv==0.12.23
      - name: Download and verify Slicer
        id: slicer
        run: python tools/runtimes/download_slicer.py "${{ matrix.channel }}" --output build/slicer
      - name: Build the extension with its private inference runtime
        run: |
          mkdir -p build/runtime
          tar -xzf build/runtime-download/desktop-runtime.tar.gz -C build/runtime
          build/runtime/python/bin/python3 tests/integration/runtime/fixtures.py --output build/runtime-fixtures
          python tools/packaging/build_scripted.py --slicer-version "${{ steps.slicer.outputs.slicer_version }}" \
            --inference-wheel build/runtime-download/backend/dist/vessel_inference-0.1.0-py3-none-any.whl \
            --desktop-runtime build/runtime --output build/desktop-package
      - name: Run packaged Python and GPU inference through real Slicer
        run: |
          xvfb-run -a "${{ steps.slicer.outputs.slicer_executable }}" --no-splash --no-main-window --testing \
            --additional-module-paths "$PACKAGE_ROOT/lib/Slicer-${{ steps.slicer.outputs.slicer_version }}/qt-scripted-modules" \
            --python-script "$GITHUB_WORKSPACE/tests/integration/slicer/desktop.py" > build/desktop-package/slicer.log 2>&1
      - name: Keep application acceptance reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-inference-slicer-${{ matrix.channel }}
          retention-days: 7
          path: |
            build/desktop-package/*.json
            build/desktop-package/*.log
            build/slicer/download.json

  web-runtime:
    name: Packaged WASM inference / SlicerWeb
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SLICERWEB_WHEELS: ${{ github.workspace }}/build/web-runtime/wheels
      SLICERWEB_EXTENSIONS: ${{ github.workspace }}/build/web-package/wheels
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wasm-runtime
          path: build/runtime-download
      - name: Prepare published SlicerWeb and fixture generation
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install uv==0.12.23
          uv sync --project deployment/inference --frozen --group test
          deployment/inference/.venv/bin/python tests/integration/runtime/fixtures.py --output build/runtime-fixtures
          python tools/runtimes/prepare_slicerweb.py --output build/web-runtime
      - name: Package shared Python and the compiled WASM component
        run: |
          python tools/packaging/build_scripted.py --slicer-version "${{ steps.web.outputs.slicer_version }}" \
            --inference-wheel build/runtime-download/backend/dist/vessel_inference-0.1.0-py3-none-any.whl \
            --wasm-runtime build/runtime-download/wasm/dist --output build/web-package
          python tools/packaging/build_slicerweb.py --source "${{ steps.web.outputs.source }}" \
            --slicer-version "${{ steps.web.outputs.slicer_version }}" --build build/web-package
      - name: Build the web application against its published runtime
        working-directory: ${{ steps.web.outputs.source }}/web
        run: |
          npm ci
          npm run build:app
      - name: Test compiled GPU inference from Python in SlicerWeb
        run: node tests/integration/slicer/slicerweb.mjs "${{ steps.web.outputs.source }}" build/web-package --fixtures build/runtime-fixtures --allow-software
      - name: Keep browser acceptance reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wasm-inference-slicerweb
          retention-days: 7
          path: |
            build/web-package/results/
            build/web-runtime/wheels/build-info.json
