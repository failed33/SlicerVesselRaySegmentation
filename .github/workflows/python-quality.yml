name: Python quality

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["**/*.py", "**/pyproject.toml", "**/uv.lock", ".github/workflows/python-quality.yml"]
  pull_request:
    paths: ["**/*.py", "**/pyproject.toml", "**/uv.lock", ".github/workflows/python-quality.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  pyrefly:
    name: Pyrefly types / ${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: inference, project: deployment/inference, group: test, config: deployment/inference/pyproject.toml}
          - {scope: monai, project: deployment/monai, group: dev, config: deployment/monai/pyproject.toml}
          - {scope: application, project: deployment/monai, group: dev, config: pyproject.toml}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - name: Install the pinned development tools
        run: uv sync --frozen
      - name: Install the package-specific typing environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/${{ matrix.project }}/.venv-typecheck
        run: uv sync --project "${{ matrix.project }}" --python 3.12 --frozen --all-extras --group "${{ matrix.group }}"
      - name: Check types with Pyrefly
        run: uv run --frozen pyrefly check --config "${{ matrix.config }}" --output-format github
